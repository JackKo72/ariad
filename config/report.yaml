# ARIAD stage 2 외래 전 의료진 리포트 설정 (docs/ARIAD_stage2_design.md Part 3-1·3-4·5-1, Step 6).
config_version: "0.1.0"
review_status: draft_unreviewed

# Part 3-1: 외래 7일 전 시점에 직전 완료 주(월–일) 기준으로 묶는다.
days_before_visit: 7
weeks: 4

# Part 3-4: 이 사유는 리포트 상단으로 올린다.
top_codes: [PLAN, M-REF, M-EMO, MED]
# Part 3-4: 같은 사유가 N주 연속이면 기본 대응을 자동 제안한다.
consecutive_weeks_for_suggestion: 2

# 4주 종합 판정별 제안 (Part 3-2 "다음 액션" + Part 2-3 시나리오 D 선택지). 문구 검토 필요.
label_suggestions:
  adherent: "현재 목표 유지"
  partial: "목표 유지, 주요 사유 대응"
  non_adherent: "목표 하향 또는 대체 행동 검토"
  indeterminate: "응답 장벽(측정 문제)부터 확인"

# 목표 표시용 단위 이름. {v}는 목표값.
unit_labels:
  days_per_week: "주 {v}일"
  days: "{v}일"
  sessions_per_week: "주 {v}회"
  times_per_week: "주 {v}회 이하"
  minutes_per_week: "주 {v}분"
  measurements_per_week: "주 {v}회 측정"
  drinks_per_week: "주 {v}잔 이하"
  sugary_drinks_per_week: "주 {v}회 이하"
  cigarettes_per_day: "하루 {v}개비"
  prompted_breaks_per_day: "하루 {v}회"
  score_of_7: "{v}점 이상 (7점 만점)"
