# ARIAD stage 2 red flag 규칙 (docs/ARIAD_stage2_design.md Part 3-3, Step 5).
#
# 사유 분류보다 먼저 적용한다. 하나라도 걸리면 분류를 건너뛰고
# 안내 문구 + 의료진 알림으로 보낸다. LLM이 아니라 이 규칙이 판단한다.
#
# - patterns: 환자·보호자 자유 응답에 적용하는 정규식 (Python re).
#   놓치는 것보다 과탐이 낫다는 원칙으로 넓게 잡았다. 부정문("가슴은 안
#   아파요")도 걸릴 수 있다 → 의료진이 확인.
# - numeric: 응답 텍스트 또는 기기 수치에서 읽은 값의 기준.
# - review_status: draft_unreviewed → 의료진이 목록·문구를 검토해야 한다.

rules_version: "0.1.0"
review_status: draft_unreviewed

categories:
  new_neuro_deficit:
    label_ko: 새 신경학적 증상 (편측 마비·언어장애·안면마비)
    patterns:
      # 변화·발생을 나타내는 표현과 함께 나온 증상. "편마비로 걷기 힘들어요"
      # 같은 기존 장애 설명은 C-PHY로 분류되도록 '마비' 단독은 잡지 않는다.
      - "(갑자기|새로|오늘|어제|아까|방금|아침에).{0,15}(마비|힘이\\s*(빠|없어지)|저리|감각이|말이|발음|얼굴|입이|눈이)"
      - "마비가\\s*(왔|생기|생겼|심해|더)"
      - "힘이\\s*빠(지|져|졌)"
      - "말이\\s*(어눌|꼬|안\\s*나|잘\\s*안\\s*나)"
      - "발음이\\s*(어눌|이상|꼬|새)"
      - "(얼굴|입).{0,10}(돌아갔|돌아가|비뚤|처지|처졌)"
      - "입꼬리"
      - "안면\\s*마비"
      - "한쪽.{0,10}(안\\s*보|감각이|저리|힘이)"
      - "앞이\\s*(갑자기\\s*)?(안\\s*보|흐려)"
  chest_pain:
    label_ko: 흉통
    patterns:
      - "흉통"
      - "가슴.{0,8}(아프|아파|아팠|통증|조이|조여|답답|짓누|쥐어짜)"
  syncope:
    label_ko: 실신
    patterns:
      - "실신"
      - "기절"
      - "(의식|정신)을?\\s*잃"
      - "쓰러졌|쓰러져"
  hypoglycemia:
    label_ko: "혈당 <70 mg/dL"
    patterns:
      - "저혈당"
      - "당이\\s*떨어"
    numeric:
      # "혈당 62", "혈당이 아침에 55" 처럼 혈당 뒤에 오는 첫 숫자. 뒤에 횟수·기간
      # 단위가 붙은 숫자("혈당 재는 걸 10일 동안 못 했어요")는 혈당값이 아니다.
      value_pattern: "혈당\\D{0,12}?(\\d{2,3})(?![\\d.]|\\s*(?:번|회|일|분|시간|시|개|주|잔|달|개월|kg|킬로))"
      lt: 70  # mg/dL, Part 3-3 및 catalog H2 safety_rules와 같은 값
  repeated_falls:
    label_ko: 반복 낙상
    patterns:
      - "(또|다시|자꾸|여러\\s*번|두\\s*번|세\\s*번|몇\\s*번|두\\s*차례|이번\\s*주에만).{0,8}(넘어|낙상|자빠)"
      - "(넘어|낙상).{0,10}(또|다시|두\\s*번|세\\s*번|여러\\s*번)"

# 환자에게 보낼 안내 문구 (Part 3-3: 즉시 119·응급실 안내 + 의료진 알림).
# 의학적 처치 지시는 넣지 않았다. 의료진 문구 검토 필요.
guidance_template: >-
  말씀하신 내용은 바로 확인이 필요한 증상일 수 있습니다.
  지금 증상이 있으면 즉시 119에 전화하거나 가까운 응급실로 가세요.
  담당 의료진에게도 알림을 보냈습니다.
